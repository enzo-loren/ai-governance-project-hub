name: Actualizar extracto desde Sheets
on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: "Escribe PUBLICAR tras revisar que el resumen no contiene información reservada"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: sincronizacion-google-sheets
  cancel-in-progress: false
jobs:
  sincronizar:
    if: ${{ inputs.confirmacion == 'PUBLICAR' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extraer campos aprobados
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CONFIRMAR_PUBLICACION: ${{ inputs.confirmacion }}
        run: npm run sync:sheets
      - name: Validar extracto público
        run: |
          npm test
          npm run build
      - name: Guardar solo el archivo público
        run: |
          if ! git diff --quiet -- data/public.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/public.json
            git commit -m "data: actualizar extracto público revisado"
            git push
          else
            echo "Sin cambios en el extracto público."
          fi
